# Publishes the concept preview to GitHub Pages.
# Only the site files are published: docs/, the project notes (*.md) and
# .impeccable/ stay in the repository and never reach the preview.
name: Deploy concept preview to GitHub Pages

on:
  push:
    branches: [github-pages]
    paths: ["tax-preparers-static-site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          rsync -a \
            --exclude 'docs/' \
            --exclude '*.md' \
            --exclude '.impeccable/' \
            --exclude '.gitignore' \
            tax-preparers-static-site/ _site/
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
